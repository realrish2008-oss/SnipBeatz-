<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnipBeatz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    height:100vh;
    position:relative;
}

.logo{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    font-weight:700;
    letter-spacing:2px;
}

.content{
    position:absolute;
    top:120px;
    right:60px;
    text-align:left;
    line-height:2;
}

.heading{
    font-size:18px;
    margin-bottom:15px;
    text-transform:uppercase;
    opacity:0.8;
}

.item{
    font-size:20px;
}

.note{
    margin-top:25px;
    max-width:320px;
    line-height:1.6;
    opacity:0.8;
}

.footer{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="logo">
    SnipBeatz
</div>

<div class="content">

    <div class="heading">
        Expected Releases in 2026
    </div>

    <div class="item">• ALBUM — Power Moves</div>

    <br>

    <div class="item">• SINGLES</div>

    <div class="item">→ Insane Drippin</div>
    <div class="item">→ Ballin'</div>
    <div class="item">→ Roll Up</div>
    <div class="item">→ Real-Time</div>

    <div class="note">
        Check out the website for the latest information every month.
    </div>

</div>

<div class="footer">
    © 2026 Rishabh WorldWide Records
</div>

</body>
</html>
